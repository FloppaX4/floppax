<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloppaX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; }
        #game-container { display: none; width: 100%; height: 85vh; border: none; }
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        @media (max-width: 1024px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .game-grid { grid-template-columns: repeat(1, 1fr); } }
    </style>
</head>
<body>

    <header class="p-6 border-b border-gray-800 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-6">
            <h1 class="text-3xl font-black tracking-tighter text-red-600">
                FLOPPA<span class="text-red-500">X</span>
            </h1>
            <input type="text" id="searchInput" placeholder="Buscar juegos..." 
                   class="bg-gray-900 border border-gray-700 px-4 py-2 rounded-full text-sm focus:outline-none focus:border-red-500 transition w-64"
                   onkeyup="searchGames()">
        </div>
        <button onclick="location.reload()" class="text-xs bg-gray-900 px-4 py-2 rounded-full hover:bg-gray-800 border border-gray-700">Cerrar Juego</button>
    </header>

    <iframe id="game-container" src="" allow="autoplay; fullscreen; cross-origin-isolated" allowfullscreen></iframe>

    <main id="catalog" class="p-6">
        <h2 class="text-xl font-bold mb-6 text-gray-400">Biblioteca de Juegos</h2>
        
        <div class="game-grid" id="gameGrid">
            <!-- JUEGO 1: GTA -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://static.toiimg.com/thumb/msid-126236663,imgsize-77358,width-400,resizemode-4/126236663.jpg" alt="GTA Vice City" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">GTA Vice City</h3>
                <button onclick="startGame('https://floppax4.github.io/Gta-Vice-City-FloppaX/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 2: SNOW ROAD -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://azgames.io/upload/imgs/snowroad4.png" alt="Snow Road" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">Snow Road</h3>
                <button onclick="startGame('https://floppax4.github.io/snow-road/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 3: ESCAPE ROAD -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://imgs.crazygames.com/escape-road-asm_16x9/20250724105031/escape-road-asm_16x9-cover?metadata=none&quality=100&width=1200&height=630&fit=crop" alt="Escape Road" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">Escape Road</h3>
                <button onclick="startGame('https://kittyfind.github.io/Escape-Road/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 4: BART BASH -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://img.itch.zone/aW1nLzIyNzQwNzU3LnBuZw==/original/4niA%2BV.png" alt="Bart Bash" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">Bart Bash</h3>
                <button onclick="startGameHTML(bartBashCode)" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 5: PEOPLE PLAYGROUND -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1118200/header.jpg?t=1776802758" alt="People Playground" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">People Playground</h3>
                <button onclick="startGame('https://floppax4.github.io/people-playground/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 6: SOLAR SMASH -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://hotgames.io/data/image/game/SolarSmash.png" alt="Solar Smash" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">Solar Smash</h3>
                <button onclick="startGame('https://floppax4.github.io/solar-smash/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>

            <!-- JUEGO 7: LA MADRIGUERA -->
            <div class="game-card bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-green-500 transition">
                <div class="h-40 bg-gray-800 rounded mb-4 flex items-center justify-center overflow-hidden">
                    <img src="https://images.sftcdn.net/images/t_app-cover-s,f_auto/p/47fdf38b-4656-4e0c-ba53-6c9066e90caf/2690162887/la-madriguera-LwuMgr.jpg" alt="La Madriguera" class="h-full w-full object-cover">
                </div>
                <h3 class="font-bold text-lg game-name">La Madriguera</h3>
                <button onclick="startGame('https://floppax4.github.io/la-madriguera/')" 
                        class="mt-4 w-full bg-green-600 py-2 rounded font-bold hover:bg-green-500 transition">JUGAR</button>
            </div>
        </div>
    </main>

    <script>
        const bartBashCode = `<!DOCTYPE html>
<html lang="en">
	<head>
		<base href="https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/stupidbartbash/">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>bartbash</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-image: url('load.png');
	background-color: #111; 
	background-size: contain;
	background-position: center center;
	background-repeat: no-repeat;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	visibility: hidden;
}

#status-splash {
	position: absolute;
	top: 1%;
	left: 50%;
	transform: translate(-50%, -50%);
	max-width: 80vw;
	max-height: 40vh;
}

#status-progress {
	display: none;
	position: absolute;
	left: 50%;
	bottom: 38.0%;
	transform: translateX(-50%);
	width: 79.3vw;
	height: 35.5px;
	-webkit-appearance: none;
	appearance: none;
	border: 1px solid white; 
	background-color: transparent; 
	overflow: hidden; 
}

#status-notice {
	display: none;
	background-color: rgba(91, 57, 67, 0.9); 
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 1rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	z-index: 1;
}

#status-splash.show-image--false { display: none; }
#status-splash.use-filter--false { image-rendering: pixelated; }
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"><\/script>
<script>
async function fetchAndMergeFile(baseUrl, filename, parts) {
  const chunks = [];
  for (let i = 1; i <= parts; i++) {
    const response = await fetch(baseUrl + filename + '.part' + i);
    if (!response.ok) throw new Error('Failed to fetch ' + filename + '.part' + i);
    const arrayBuffer = await response.arrayBuffer();
    chunks.push(arrayBuffer);
  }
  const totalLength = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
  const merged = new Uint8Array(totalLength);
  let offset = 0;
  for (const chunk of chunks) {
    merged.set(new Uint8Array(chunk), offset);
    offset += chunk.byteLength;
  }
  return merged.buffer;
}

async function initializeGame() {
  const baseUrl = 'https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/stupidbartbash/';
  const [wasmData, pckData] = await Promise.all([
    fetchAndMergeFile(baseUrl, 'index.wasm', 3),
    fetchAndMergeFile(baseUrl, 'index.pck', 6)
  ]);
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    if (url.includes('index.wasm')) {
      return Promise.resolve(new Response(wasmData, {
        status: 200,
        headers: { 'Content-Type': 'application/wasm' }
      }));
    }
    if (url.includes('index.pck')) {
      return Promise.resolve(new Response(pckData, {
        status: 200,
        headers: { 'Content-Type': 'application/octet-stream' }
      }));
    }
    return originalFetch(url, options);
  };
  startGodotEngine();
}

function startGodotEngine() {
  const GODOT_CONFIG = {
    "args":[],
    "canvasResizePolicy":2,
    "ensureCrossOriginIsolationHeaders":true,
    "executable":"index",
    "experimentalVK":false,
    "fileSizes":{"index.pck":81342576,"index.wasm":43699192},
    "focusCanvas":true,
    "gdextensionLibs":[]
  };
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame().then(() => {
    document.getElementById('status').remove();
  }).catch(err => {
    console.error(err);
  });
}

initializeGame().catch(err => {
  console.error('Failed to initialize game:', err);
});
<\/script>
	</body>
</html>`;

        function startGame(url) {
            const iframe = document.getElementById('game-container');
            const catalog = document.getElementById('catalog');
            iframe.src = url;                 
            iframe.style.display = 'block';
            catalog.style.display = 'none';
        }

        function startGameHTML(htmlContent) {
            const iframe = document.getElementById('game-container');
            const catalog = document.getElementById('catalog');
            iframe.removeAttribute('src');  
            iframe.srcdoc = htmlContent;    
            iframe.style.display = 'block';
            catalog.style.display = 'none';
        }

        function searchGames() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');
            for (let card of cards) {
                const name = card.querySelector('.game-name').innerText.toLowerCase();
                card.style.display = name.includes(filter) ? "" : "none";
            }
        }
    </script>
</body>
</html>
